name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate Android project
        run: flutter create --platforms=android --org com.pestamini --project-name pesta_mini .
      - name: Apply app sources
        run: |
          rm -rf test
          cp pubspec.app.yaml pubspec.yaml
          rm -rf lib && mkdir lib && cp app_src/*.dart lib/
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Pesta Mini"#' android/app/src/main/AndroidManifest.xml
      - name: Matikan Android lint (penyebab crash di assembleRelease)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/nolint.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital') || t.name.startsWith('lintAnalyze') || t.name.startsWith('lintReport') || t.name == 'lint') { t.enabled = false }
            }
          }
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PestaMini-APK
          path: build/app/outputs/flutter-apk/app-release.apk
