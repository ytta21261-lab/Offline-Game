name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=android --org com.pestamini --project-name pesta_mini .
      - run: cp src/main.dart lib/main.dart
      - run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' $M
          sed -i 's|android:label="[^"]*"|android:label="Pesta Mini"|' $M
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PestaMini-APK
          path: build/app/outputs/flutter-apk/app-release.apk
